[project]
name = "lira-device"
version = "0.1.0"
description = "LIRA 低视力智能阅读与家电助手 — 设备端软件（Orange Pi 5 / RK3588S）"
requires-python = ">=3.11"
# base 组：PyYAML（配置）+ pypinyin（词表拼音归一，2026-10-06 计划 U1）。
# 重型依赖按单元逐步启用，放在 optional groups 中，
# 避免一次性安装 sherpa-onnx / rknn / paddle 等板上专用包到 x86 开发环境。
dependencies = [
    "PyYAML>=6.0",
    # 退出/勿扰词表拼音归一（纯 Python，无二进制依赖）
    "pypinyin>=0.50",
]

[project.optional-dependencies]
# U5：OpenAI 兼容远程 LLM 客户端
llm = ["openai>=1.40"]
# U4：x86 OCR 开发后端
ocr-x86 = ["onnxruntime>=1.17", "pillow>=10.0", "opencv-python-headless>=4.9", "pyclipper>=1.3", "shapely>=2.0"]
# U2：音频（sherpa-onnx 支持跨平台 x86 开发）
audio = ["sherpa-onnx>=1.10", "sounddevice>=0.4"]
# U7：设备本地触摸屏 Web UI（python-multipart：starlette 表单解析依赖）
ui = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9", "itsdangerous>=2.1"]
# M7：设备↔后台真实 WS 同步传输（lira/sync_ws.py）
sync = ["websockets>=13"]
# M5：python-broadlink 不入 pyproject（上游 1.0.x 元数据要求 py>=3.13，板上 3.11 需
# --ignore-requires-python 安装），仅按 deploy/SETUP.md 2.6 装入板上 venv 并锁定 ==1.0.6

# dev：单元 + e2e。e2e 在同进程内拉起真实后台（backend/app），故附带其运行依赖
# （FastAPI 表单/Jinja2 + PyJWT/bcrypt/itsdangerous 鉴权），见 tests/e2e/conftest.py。
dev = [
    "pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27",
    "fastapi>=0.110", "jinja2>=3.1", "python-multipart>=0.0.9",
    "pyjwt>=2.8", "bcrypt>=4.1", "itsdangerous>=2.1",
    "websockets>=13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lira*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
