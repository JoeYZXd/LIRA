<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LIRA 子女管理后台{% endblock %}</title>
  <style>
    :root { --fg:#1c2430; --muted:#66707d; --line:#d9dee5; --bg:#f5f7fa; --card:#fff; --accent:#1a66d6; --danger:#b3261e; --ok:#1c7d43; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; margin:0; background:var(--bg); color:var(--fg); }
    nav { background:var(--card); border-bottom:1px solid var(--line); padding:10px 20px; display:flex; gap:16px; align-items:center; }
    nav a { color:var(--accent); text-decoration:none; }
    nav .spacer { flex:1; }
    main { max-width: 880px; margin: 24px auto; padding: 0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 20px; margin-bottom:20px; }
    h1 { font-size:20px; } h2 { font-size:16px; margin:0 0 12px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:14px; vertical-align: top; }
    .online { color:var(--ok); font-weight:600; } .offline { color:var(--muted); }
    .danger { color:var(--danger); }
    .muted { color:var(--muted); font-size:13px; }
    .token-once { background:#fff8e1; border:1px solid #e0c96b; padding:10px 12px; border-radius:6px; word-break:break-all; font-family:monospace; }
    form.inline { display:inline; }
    button { padding:6px 14px; border:1px solid var(--line); border-radius:6px; background:var(--card); cursor:pointer; font-size:14px; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button.danger-btn { color:var(--danger); border-color:var(--danger); }
    label { display:block; font-size:13px; color:var(--muted); margin:8px 0 2px; }
    input[type=text], input[type=password] { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
    .row { display:flex; gap:12px; } .row > div { flex:1; }
    .flash { padding:10px 14px; border-radius:6px; margin-bottom:16px; }
    .flash.error { background:#fdecea; color:var(--danger); }
    .switch { display:inline-flex; align-items:center; gap:8px; font-size:14px; }
    code { background:#eef1f5; padding:1px 5px; border-radius:4px; }
  </style>
</head>
<body>
<nav>
  <strong>LIRA 后台</strong>
  <a href="/">总览</a>
  {% if admin_name %}
  <span class="spacer"></span>
  <span class="muted">{{ admin_name }}</span>
  <form method="post" action="/logout" class="inline">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <button type="submit">退出登录</button>
  </form>
  {% endif %}
</nav>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
