# LIRA 设备端默认配置。
# 覆盖优先级：环境变量 (LIRA_LLM_BASE_URL 等) > 本文件 > 代码内置默认值。
# 注意：隐私模式、高危设备表等运行时可变状态不入配置文件（运行期入库/内存）。

llm:
  # GLM OpenAI 兼容端点（Key Decisions）；可替换为任意 OpenAI 兼容服务
  base_url: https://open.bigmodel.cn/api/paas/v4
  # 必填项：建议用环境变量注入，不要提交真实 key 到仓库
  api_key: ""
  model: glm-4-flash
  # Kimi Agent 按需搜索（需要 Moonshot 官方端点；搜索和模型调用分别计费）
  web_search_enabled: false
  timeout_seconds: 10.0
  # U5 熔断降级：连续失败 N 次开断路，冷却后放行试探（R10）
  breaker_failure_threshold: 3
  breaker_cooldown_seconds: 60.0
  # R28：远程处理超过该秒数未出首 token，播报"正在为您仔细阅读，请稍等"
  wait_feedback_seconds: 2.0
  # U5：复杂文本转白话长度阈值（字符）；医疗类别词不受阈值限制（R3/R27）
  colloquial_threshold_chars: 150

hal:
  backend: mock            # mock (x86 开发) | board (板上, U10/M7)
  mock_images_dir: assets/mock_images   # 相对路径按仓库根解析
  mock_audio_dir: assets/mock_audio
  # M7：板上设备号固化（空串 = 系统默认；数值串 = sounddevice 序号）
  mic_device: ""           # 板上: 一律 "pipewire"（经 PipeWire 默认源=USB麦阵 card3）。
                           # 注意 PortAudio 序号≠ALSA 卡号（序号"3"是 sysdefault 无输入）；
                           # 实测依据见 SETUP.md 2.8 / deploy/system/lira.service
  speaker_device: ""       # 板上: 一律 "pipewire"（经 PipeWire 默认汇=ES8388 card2）。
                           # ES8388 hw 直开 22050 被拒（ALSA -22），必须走插件做格式转换
  camera_device: ""        # 板上: OV13855@CAM1 → /dev/video0（M3 实测）
  ir_host: ""              # 板上: BroadLink RM4 Mini 固定 IP（如 192.168.101.27；SETUP 2.6）
  ir_mac: ""               # 板上: 与 ir_host 成对必填（如 ec:0b:ae:0c:74:e4）；
                           # 任一为空 = IR 未配置，装配回退 Mock（发射只记录不生效）

# U7：设备 Web UI（局域网浏览器访问；M7 起随主循环 in-process 挂载）
ui:
  host: 0.0.0.0
  port: 8080

# 开发者控制台（默认关；开启后经设备口令进入，采集类测试受隐私联锁）
dev_console:
  enabled: false

# U6：本地家电配置库（R13 本地持久化；运行期产物，gitignore *.db）
db_path: data/device.db

# U6：设备↔后台配置同步（R30 设备侧）。ws_url 为空 = 未配置后台，纯本地离线运行
sync:
  ws_url: ""               # 如 ws://192.168.1.10:8000/ws/device（U8 后台接入后填写）
  heartbeat_seconds: 60.0  # 心跳拉取兜底周期（安全关键变更走在线即时推送）
  device_token: ""         # 开发期预置：后台「注册设备」一次性展示的 token（或环境变量 LIRA_SYNC_DEVICE_TOKEN）

log_level: INFO
