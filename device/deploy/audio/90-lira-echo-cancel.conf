# Install under ~/.config/pipewire/pipewire.conf.d/ after backing up config.
# PipeWire 0.3.65; no desktop default-node changes.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = false
      audio.rate = 48000
      audio.channels = 1
      audio.position = [ MONO ]
      capture.props = {
        node.name = lira_echo_capture
        target.object = alsa_input.usb-Timesintelli_USB_Audio_Device_223484-00.analog-stereo
        node.dont-fallback = true
      }
      source.props = { node.name = lira_echo_source }
      sink.props = { node.name = lira_echo_sink }
      playback.props = {
        node.name = lira_echo_playback
        target.object = alsa_output.platform-es8388-sound.HiFi__hw_rockchipes8388__sink
        node.dont-fallback = true
      }
    }
  }
]
