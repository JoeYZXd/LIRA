[project]
name = "lira-backend"
version = "0.1.0"
description = "LIRA 子女管理后台（FastAPI + SQLite，Web + token 鉴权）"
requires-python = ">=3.11"
# U8 实装后的技术栈（Key Decisions：FastAPI + SQLite(WAL) + Jinja2 无 Node
# 构建链；PyJWT + bcrypt 鉴权；itsdangerous 签名 CSRF；纯表单页面未用 HTMX）。
# 协议 schema 复用方式：app/protocol.py 为 device/lira/protocol.py 的同步副本
# （见该文件头与 test_protocol_parity_with_device），不引入 device 包依赖。
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
