<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIRA 设备面板</title>
  <style>
    /* ===== LIRA 设计基底：温馨家庭小助手（U4 令牌化） =====
       调性：暖米白底 + 白色圆角卡片 + 暖琥珀主色，柔和暖影、大字号高对比。
       令牌全部置于 :root，类样式仅由令牌组合；移动端优先，768px 起放宽留白。
       状态语义映射（不得混淆）：
         红系 = 隐私开启/危险/注意；绿系 = 隐私关闭/正常/安全；灰系 = 中性。 */

    :root {
      /* —— 色板（暖色） —— */
      --bg: #FAF5F2;             /* 页面底：暖米白 */
      --surface: #FFFFFF;        /* 卡片面：纯白 */
      --ink: #1C1917;            /* 正文：暖深墨（米白底约 16.2:1） */
      --ink-soft: #57534E;       /* 次要文字（白底约 7.6:1） */
      --border: #EFE7E0;         /* 暖色细分隔线 */
      --border-strong: #E3D9D0;  /* 输入框边 */
      --brand: #B45309;          /* 主色：暖琥珀（白字约 5.0:1） */
      --brand-deep: #92400E;     /* 主色悬停 / 深琥珀 */
      --brand-soft: #FEF3C7;     /* 琥珀浅底（提醒标签） */
      --ok: #166534;             /* 正常/安全：绿（浅绿底约 6.5:1） */
      --ok-soft: #DCFCE7;
      --danger: #B91C1C;         /* 注意/隐私开/危险：红 */
      --danger-deep: #991B1B;
      --danger-soft: #FEE2E2;
      --neutral: #44403C;        /* 中性：暖灰 */
      --neutral-soft: #E7E5E4;
      --ring-tint: rgba(180, 83, 9, .18);  /* 聚焦光晕色 */
      --shadow-tint: 93, 64, 42;           /* 暖棕影基色（rgb 分量） */

      /* —— 圆角 —— */
      --radius-sm: 8px;     /* 小标签 */
      --radius-md: 14px;    /* 按钮 / 输入框 */
      --radius-lg: 20px;    /* 卡片 */
      --radius-full: 999px; /* 药丸 */

      /* —— 间距阶 —— */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;

      /* —— 阴影（暖色柔和双层） —— */
      --shadow-sm: 0 1px 2px rgba(var(--shadow-tint), .06),
                   0 1px 3px rgba(var(--shadow-tint), .08);
      --shadow-md: 0 2px 4px rgba(var(--shadow-tint), .06),
                   0 8px 20px rgba(var(--shadow-tint), .10);
      --shadow-focus: 0 0 0 4px var(--ring-tint);

      /* —— 字号阶（正文 20px 基准不降） —— */
      --fs-h1: 28px;
      --fs-h2: 22px;
      --fs-body: 20px;
      --fs-pill: 18px;
      --fs-table: 17px;
      --fs-small: 16px;
      --fs-tag: 14px;

      /* —— 组件内距（间距阶外补齐令牌） —— */
      --pad-btn: 12px var(--space-5);
      --pad-btn-sm: var(--space-2) var(--space-4);
      --pad-pill: var(--space-2) var(--space-4);
      --pad-cell: var(--space-2) 6px;
      --pad-tag: 2px var(--space-2);
      --pad-card: var(--space-4);
      --pad-card-wide: 20px;

      /* —— 动效 —— */
      --speed: 160ms;
      --focus-ring: 3px solid var(--brand);
    }

    * { box-sizing: border-box; }
    body {
      font-family: system-ui, "Noto Sans CJK SC", sans-serif;
      margin: 0; background: var(--bg); color: var(--ink);
      font-size: var(--fs-body); line-height: 1.55;
    }
    main { max-width: 720px; margin: 0 auto; padding: var(--space-4); }
    @media (min-width: 768px) {
      main { padding: var(--space-5); }
    }
    h1 { font-size: var(--fs-h1); }
    h2 { font-size: var(--fs-h2); margin-bottom: var(--space-2); }
    a { color: var(--brand-deep); font-weight: 600; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--pad-card);
      margin-bottom: var(--space-4);
      box-shadow: var(--shadow-md);
    }
    @media (min-width: 768px) {
      .card { padding: var(--pad-card-wide); }
    }
    .status-row { display: flex; gap: var(--space-3); flex-wrap: wrap; }
    .pill {
      padding: var(--pad-pill); border-radius: var(--radius-full);
      font-weight: 600; font-size: var(--fs-pill);
    }
    .pill.on      { background: var(--danger-soft);  color: var(--danger); }  /* 隐私开=注意 */
    .pill.off     { background: var(--ok-soft);      color: var(--ok); }      /* 隐私关=正常 */
    .pill.neutral { background: var(--neutral-soft); color: var(--neutral); }

    button {
      font-size: var(--fs-body); padding: var(--pad-btn);
      border: none; border-radius: var(--radius-md);
      cursor: pointer; font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: background-color var(--speed) ease-out,
                  box-shadow var(--speed) ease-out,
                  transform var(--speed) ease-out;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); box-shadow: none; }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    button.primary { background: var(--brand); color: var(--surface); }
    button.primary:hover { background: var(--brand-deep); }
    button.danger  { background: var(--danger); color: var(--surface); }
    button.danger:hover  { background: var(--danger-deep); }
    button.small   { font-size: var(--fs-small); padding: var(--pad-btn-sm); }

    input[type="password"], input[type="text"], input[type="number"] {
      font-size: var(--fs-body); padding: var(--space-3);
      border: 2px solid var(--border-strong); border-radius: var(--radius-md);
      background: var(--surface); color: var(--ink);
      width: 100%; margin: var(--space-2) 0;
      transition: border-color var(--speed) ease-out, box-shadow var(--speed) ease-out;
    }
    input[type="password"]:focus, input[type="text"]:focus, input[type="number"]:focus {
      outline: none; border-color: var(--brand); box-shadow: var(--shadow-focus);
    }
    form.inline { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
    form.inline input { width: 120px; margin: 0; }

    .error { color: var(--danger); font-weight: 600; margin: var(--space-2) 0; }
    .muted { color: var(--ink-soft); font-size: var(--fs-small); }

    table { width: 100%; border-collapse: collapse; font-size: var(--fs-table); }
    th, td { text-align: left; padding: var(--pad-cell); border-bottom: 1px solid var(--border); }
    th { color: var(--ink-soft); font-weight: 600; }
    tr:last-child td { border-bottom: none; }

    .tag { font-size: var(--fs-tag); padding: var(--pad-tag); border-radius: var(--radius-sm); }
    .tag.hr  { background: var(--brand-soft);   color: var(--brand-deep); }
    .tag.dis { background: var(--neutral-soft); color: var(--ink-soft); }
    .tag.ok  { background: var(--ok-soft);      color: var(--ok); }

    :focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
      button:hover, button:active { transform: none; }
    }
  </style>
  {% block extra %}{% endblock %}
</head>
<body>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
